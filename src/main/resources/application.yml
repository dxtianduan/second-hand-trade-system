server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: secondhand

  # ==================== 数据源 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 参数说明（一个都不能省）：
    #   useUnicode + characterEncoding : 防止中文乱码
    #   serverTimezone                 : MySQL 8 不写会报时区错误
    #   useSSL=false                   : 本地开发关掉，避免证书告警
    #   allowPublicKeyRetrieval=true   : MySQL 8.4 默认 caching_sha2_password，不写会报
    #                                    "Public Key Retrieval is not allowed"
    url: jdbc:mysql://localhost:3306/second_hand_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    # 数据库账号密码通过环境变量注入，禁止把真实密码写进仓库
    # 本地运行：在 IDE 的 Run Configuration 里设置 DB_USERNAME / DB_PASSWORD
    # 命令行运行：export DB_USERNAME=root DB_PASSWORD=你的密码
    # 详见项目根目录的「本地配置说明.md」
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 监控页面：http://localhost:8080/druid  账号密码通过环境变量注入
      stat-view-servlet:
        enabled: true
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:admin}
        url-pattern: /druid/*
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000

  # ==================== Redis ====================
  redis:
    host: localhost
    port: 6379
    database: 0
    # 没设密码就留空
    password:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2
        max-wait: 3000ms

  # ==================== Jackson ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # 上传文件大小限制
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

# ==================== MyBatis-Plus ====================
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.secondhand.entity
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除配置（本项目用 status 字段而非 deleted，故此处不启用）
      table-underline: true
  configuration:
    # 开启驼峰命名转换：create_time -> createTime
    map-underscore-to-camel-case: true
    # 关闭一级缓存之外的东西，避免和二级缓存冲突
    cache-enabled: false
    # 控制台打印 SQL，方便调试；上线要关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== 日志 ====================
logging:
  level:
    root: info
    com.secondhand: debug
    # 打印 SQL 参数，调试很有用
    com.secondhand.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ==================== 业务自定义配置 ====================
secondhand:
  jwt:
    # 签名密钥通过环境变量注入，禁止把真实密钥写进仓库
    # 本地运行：设置环境变量 JWT_SECRET
    # 生成方式：openssl rand -hex 32
    secret: ${JWT_SECRET:secondhand-local-dev-only-secret-change-me}
    # token 有效期（毫秒）：7 天
    expire: 604800000
    header: Authorization
    prefix: "Bearer "
  upload:
    # 本地存储路径（生产环境应改为对象存储）
    path: E:/secondhand-upload/
    # 允许的图片类型
    allow-types: jpg,jpeg,png,webp,gif
    max-size: 5242880
  order:
    # 订单支付超时时间（分钟）
    pay-timeout: 30
